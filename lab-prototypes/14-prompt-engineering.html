<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EY.ai Lab prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/lab.css">
<script src="assets/lab.js"></script>
</head>
<body data-page="14-prompt-engineering">
<main class="page "><section id="stage" class="stage glass"></section><aside id="side" class="side"></aside></main>
<script>
const { C, s, h, $, clamp, lerp, ease, wait, tween, hexA, svg, arrow, text, node, edge, port, link, token, panzoom, zoomButtons, seg, slider, toggle, card, readout, kpis, legend, store, PAGES } = Lab;
const stage = $("stage"), side = $("side");
// ---- What makes a good prompt: switch components on, watch the prompt, the likely output and the quality change. Then the ladder to agents. ----
const COMP = [["role", "Role", C.blue, "Who is answering", 8], ["context", "Context", C.cyan, "What it needs to know", 18], ["task", "Specific task", C.yellow, "Exactly what to produce", 20], ["constraints", "Constraints", C.orange, "What to avoid, what to do when unsure", 14], ["format", "Output format", C.magenta, "The shape of the answer", 14], ["examples", "Examples", C.purple, "What good looks like", 14], ["criteria", "Success criteria", C.green, "How we will check it", 12]];
const TASKS = [
  { name: "Summarise a contract for the CFO", bare: "Summarise this contract.",
    role: "You are a senior commercial lawyer briefing a CFO who has ten minutes and no legal background.", context: "The attached document is a five-year logistics services agreement with a new supplier. We are deciding this week whether to sign. Our main concerns are cost escalation and how hard it is to exit.", task: "Summarise the commercial terms that affect that decision: price and indexation, minimum volumes, termination rights, liability caps and penalties.", constraints: "Use only what is in the document. If a point is not covered, write “not stated” instead of inferring. Do not give a recommendation.", format: "Return a table with columns: Topic · What the contract says · Clause · Risk (low/medium/high). Then three bullets on what to negotiate.", examples: "Example row: Indexation · Prices rise yearly by CPI + 2%, uncapped · §7.3 · high", criteria: "A reader must be able to verify every row against the cited clause in under a minute.",
    out: ["This contract is an agreement between two parties for logistics services. It covers various terms including payment, duration and obligations of both sides. Overall it appears to be a standard agreement…", "The agreement runs five years. Prices are indexed annually. There are minimum volume commitments and termination is possible under certain conditions. Liability is limited. The CFO should consider the cost implications carefully.", "Indexation: CPI + 2% yearly, uncapped (§7.3), high risk.\nMinimum volume: 80% of forecast, shortfall payable (§5.1), medium.\nTermination: for convenience only after year 3, 12 months' notice (§14.2), high.\nLiability cap: not stated.", "| Topic | Contract says | Clause | Risk |\n| Indexation | CPI + 2% yearly, uncapped | §7.3 | high |\n| Minimum volume | 80% of forecast; shortfall payable | §5.1 | medium |\n| Exit | Convenience only after year 3, 12 months' notice | §14.2 | high |\n| Liability cap | not stated | – | – |\n\nTo negotiate: cap indexation · exit right from year 2 · add a liability cap"] },
  { name: "Triage a customer complaint", bare: "Handle this complaint.",
    role: "You are a customer-care specialist at a Dutch energy supplier.", context: "The message below came in by email. The customer's account shows two estimated meter readings in a row and a bill 40% above their average.", task: "Classify the complaint, state the most likely cause from the account data, and draft a reply that tells the customer what happens next and by when.", constraints: "Do not admit liability or promise a refund. If the account data does not explain the bill, say a specialist will review it. Reply in the customer's language.", format: "Return JSON: {category, likely_cause, urgency: low|normal|high, reply}. Keep the reply under 120 words.", examples: "category: “billing-estimate”, urgency: “normal”, reply: “Dank voor uw bericht. Uw laatste twee meterstanden zijn geschat…”", criteria: "A team lead should be able to send the reply unchanged in nine cases out of ten.",
    out: ["I'm sorry to hear about your experience. We take all complaints seriously and will look into this matter. Please let us know if there is anything else we can help with.", "This looks like a billing complaint. The customer is unhappy about a high bill. A suitable reply would apologise and explain that the bill will be checked.", "Category: billing, estimated reading. Likely cause: two consecutive estimated readings overstated usage. Reply: explains the estimate, asks for a photo of the meter, says a corrected bill follows within 5 working days.", "{\n  \"category\": \"billing-estimate\",\n  \"likely_cause\": \"two estimated readings in a row\",\n  \"urgency\": \"normal\",\n  \"reply\": \"Dank voor uw bericht. Uw laatste twee meterstanden zijn geschat, waardoor uw rekening hoger uitvalt. Stuurt u ons een foto van de meter? U ontvangt binnen 5 werkdagen een gecorrigeerde rekening.\"\n}"] },
  { name: "Write release notes from a change list", bare: "Write release notes.",
    role: "You are a product manager writing for business users, not developers.", context: "Below are 14 merged changes for version 4.2 of our expense tool, as raw commit messages and ticket titles.", task: "Write release notes that tell users what changed for them and what they need to do, grouped by New, Improved and Fixed.", constraints: "Leave out internal refactoring and anything with no visible effect. Do not invent benefits. If a change is unclear, list it under “To confirm” rather than guessing.", format: "Markdown. One line per item, starting with a verb, at most 20 words. A two-sentence summary on top.", examples: "Improved: Approve several expense reports at once from the overview page.", criteria: "Every line must trace to a ticket number, given in brackets.",
    out: ["Version 4.2 includes various improvements and bug fixes to enhance the user experience and performance of the application.", "New features: bulk approval, receipt scanning improvements. Fixes: several bugs resolved. Refactored the API layer and updated dependencies.", "New: Approve several reports at once. Improved: Receipt scanning now reads handwritten totals. Fixed: Mileage no longer double-counted on return trips. To confirm: “EXP-431 tweak policy engine”.", "**4.2 makes approvals faster and fixes mileage.** No action needed.\n\n**New**\n- Approve several reports at once from the overview [EXP-402]\n**Improved**\n- Scan receipts with handwritten totals [EXP-388]\n**Fixed**\n- Stop double-counting mileage on return trips [EXP-417]\n**To confirm**\n- EXP-431 “tweak policy engine”: effect unclear"] },
];
let ti = 0; const on = { role: false, context: false, task: false, constraints: false, format: false, examples: false, criteria: false };
const bar = h("div", { class: "bar" }, stage);
const sel = h("select", { class: "btn", style: "max-width:100%", on: { change: () => { ti = +sel.value; draw(); } } }, bar); TASKS.forEach((t, i) => h("option", { value: i, text: t.name }, sel));
h("button", { class: "btn", text: "All on", on: { click: () => { for (const k in on) on[k] = true; draw(); } } }, bar); h("button", { class: "btn", text: "Clear", on: { click: () => { for (const k in on) on[k] = false; draw(); } } }, bar);
const chipsEl = h("div", { style: "display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px" }, stage), chip = {};
for (const [id, t, c, d] of COMP) chip[id] = h("span", { class: "chip tap", style: `--c:${c};padding:8px 14px;font-size:13.5px`, html: `<i></i>${t}`, title: d, on: { click: () => { on[id] = !on[id]; draw(); } } }, chipsEl);
const g2 = h("div", { class: "grid2" }, stage), pBox = h("div", {}, g2), oBox = h("div", {}, g2);
h("div", { class: "eyebrow", style: "margin-bottom:6px", text: "The prompt" }, pBox); const pEl = h("div", { class: "code mono", style: "min-height:250px" }, pBox);
h("div", { class: "eyebrow", style: "margin-bottom:6px", text: "What you are likely to get back" }, oBox); const oEl = h("div", { class: "code mono", style: "min-height:250px" }, oBox);
// the ladder
h("div", { class: "eyebrow", style: "margin:18px 0 8px", text: "The same seven ideas, further up the ladder" }, stage);
const RUNG = [["Prompt", "One well-written request.", "You write it by hand each time."], ["Prompt + retrieval", "The system fetches the context for you.", "Context becomes a pipeline: search, select, insert."], ["Chain", "Several prompts in a fixed order, with checks between.", "The task is split; each step has its own format and criteria."], ["Tools", "The model can act, not just write.", "Constraints become permissions on what it may call."], ["Agent", "The model decides its own steps in a loop.", "The role becomes standing instructions; examples become reusable skills."], ["Governed platform", "Many agents under shared, enforced rules.", "Success criteria become laws and automated evaluations; the format becomes an exit contract."]];
const MAP = { role: ["–", "System prompt", "A role per step", "A role per step", "Agent instructions", "Node roles in a flow"], context: ["Pasted in", "Retrieval", "Passed between steps", "Fetched by tools", "Memory + knowledge", "Governed artefacts"], task: ["Typed", "Typed", "Decomposed", "Decomposed", "A goal", "A petition with a contract"], constraints: ["Sentences", "Sentences", "Gates between steps", "Permissions", "Guardrails", "Laws"], format: ["Described", "Described", "Schema per step", "Tool schemas", "Structured output", "Exit contract"], examples: ["Few-shot", "Few-shot", "Per step", "Tool usage examples", "Skills", "Skills + golden sets"], criteria: ["In your head", "In your head", "A check per step", "Tests", "Evaluations", "Attestations"] };
const lad = h("div", { style: "overflow-x:auto" }, stage), ladT = h("table", { class: "t" }, lad); let rung = 0;
const K = kpis(side, [["q", "Prompt quality"], ["n", "Components"]]);
const dims = card(side, "What each component buys"), dimB = h("div", {}, dims.body), ro = readout(side);
const DIM = { Clarity: ["task", "role", "format"], Grounding: ["context", "constraints"], Consistency: ["format", "examples"], Checkability: ["criteria", "format", "constraints"] };
function draw() {
  const t = TASKS[ti], act = COMP.filter(([id]) => on[id]);
  for (const [id] of COMP) chip[id].classList.toggle("on", on[id]);
  pEl.innerHTML = act.length ? act.map(([id, name, c]) => `<span style="color:${c};font-weight:700">[${name}]</span> ${t[id]}`).join("\n\n") : `<span class="d">${t.bare}</span>\n\n<span class="d">(Switch components on above to build it up.)</span>`;
  const score = act.reduce((a, c) => a + c[4], 0), stage_ = score < 20 ? 0 : score < 50 ? 1 : score < 80 ? 2 : 3;
  oEl.textContent = t.out[stage_]; oEl.style.borderColor = [C.red, C.orange, C.yellow, C.green][stage_];
  K.q(`${score}%`, [C.red, C.orange, C.yellow, C.green][stage_], ["Vague in, vague out", "Recognisable but generic", "Useful, needs checking", "Specific, structured, verifiable"][stage_]); K.n(`${act.length}/7`);
  dimB.innerHTML = Object.entries(DIM).map(([d, ks]) => { const v = ks.filter((k) => on[k]).length / ks.length; return `<div class="field" style="margin-bottom:8px"><div class="row"><span>${d}</span><b>${Math.round(v * 100)}%</b></div><div style="height:6px;border-radius:3px;background:rgba(255,255,255,.14)"><div style="height:6px;border-radius:3px;width:${v * 100}%;background:${C.yellow}"></div></div></div>`; }).join("");
  ladT.innerHTML = `<tr><th></th>${RUNG.map(([n], i) => `<th data-r="${i}" style="cursor:pointer;color:${i === rung ? C.yellow : ""}">${i + 1}. ${n}</th>`).join("")}</tr>` + COMP.map(([id, name, c]) => `<tr style="opacity:${on[id] || !act.length ? 1 : 0.4}"><td><b style="color:${c}">${name}</b></td>${MAP[id].map((v, i) => `<td style="${i === rung ? "color:#fff;background:rgba(255,230,0,.08)" : ""}">${v}</td>`).join("")}</tr>`).join("");
  ladT.querySelectorAll("th[data-r]").forEach((th) => (th.onclick = () => { rung = +th.dataset.r; draw(); }));
  ro.set(`Rung ${rung + 1} of 6`, RUNG[rung][0], `${RUNG[rung][1]}<p style="margin-top:8px"><b>What changes:</b> ${RUNG[rung][2]}</p><p style="margin-top:8px" class="hint">Nothing in the top row disappears on the way up. It stops being text someone types and becomes a part of the system that someone owns.</p>`);
}
on.task = true; draw();

</script>
</body>
</html>
