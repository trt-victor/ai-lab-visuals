<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EY.ai Lab prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/lab.css">
<script src="assets/lab.js"></script>
</head>
<body data-page="04-vibe-coding">
<main class="page "><section id="stage" class="stage glass"></section><aside id="side" class="side"></aside></main>
<script>
const { C, s, h, $, clamp, lerp, ease, wait, tween, hexA, svg, arrow, text, node, edge, port, link, token, panzoom, zoomButtons, seg, slider, toggle, card, readout, kpis, legend, store, PAGES } = Lab;
const stage = $("stage"), side = $("side");
// ---- Vibe-coding on a spectrum: who holds intent, code, review and proof in each way of working ----
const MODES = [
  { id: "auto", t: "Autocomplete", d: "The AI finishes the line you started. You are still writing every decision.", hold: ["H", "H", "H", "H"], speed: 1.3, works: "Experienced developers in a codebase they know.", breaks: "It doesn't, really. The gain is modest.", fit: [1, 1, 1, 1] },
  { id: "chat", t: "Chat assistant", d: "You ask, it answers with a snippet, you paste and adapt. A knowledgeable colleague on call.", hold: ["H", "S", "H", "H"], speed: 2, works: "Learning, debugging, small well-described functions.", breaks: "The assistant never sees the whole system, so answers fit the question but not always the code.", fit: [1, 1, 1, 0.6] },
  { id: "vibe", t: "Vibe-coding", d: "You describe what you want in plain language and accept what comes back if it seems to work. You steer by feel and rarely read the code.", hold: ["H", "A", "N", "N"], speed: 8, works: "Prototypes, demos, throwaway tools, exploring an idea in an afternoon.", breaks: "Nobody understands the code, nothing proves it is right, and every change risks breaking something unseen. Fine for a demo, dangerous in production.", fit: [1, 0.7, 0.15, 0] },
  { id: "agent", t: "Agentic engineering", d: "An agent plans, edits many files, runs the tests and iterates. An engineer sets the task, reviews the diff and owns the result.", hold: ["H", "A", "S", "S"], speed: 6, works: "Real features in real codebases, when tests and review are in place.", breaks: "Review becomes the bottleneck. Under pressure people skim large AI-written changes.", fit: [1, 1, 0.8, 0.4] },
  { id: "gov", t: "Governed delivery", d: "Agents work inside cycles with explicit laws, automated checks and exit contracts. Humans decide at the gates that matter, and every artefact carries its evidence.", hold: ["H", "A", "Y", "Y"], speed: 5, works: "Production systems, regulated environments, and teams that must scale without losing control.", breaks: "It needs investment up front: the rules, the checks and the platform have to exist first.", fit: [0.6, 1, 1, 1] },
];
const LANES = ["Intent: what and why", "Code: who writes it", "Review: who reads it", "Proof: how we know it works"];
const HOLD = { H: ["Human", C.blue], S: ["Shared", C.cyan], A: ["AI", C.magenta], N: ["Nobody", C.red], Y: ["System + human at gates", C.green] };
const FIT = ["Prototype", "Internal tool", "Production", "Regulated"];
const sv = svg(stage, 1000, 640), x0 = 230, cw = 150, y0 = 70, rh = 62, cols = [], cells = [];
MODES.forEach((m, i) => {
  const x = x0 + i * cw, g = s("g", { style: "cursor:pointer" }, sv);
  const bgc = s("rect", { x: x + 5, y: 14, width: cw - 10, height: 318, rx: 18, fill: "rgba(255,255,255,.03)", stroke: "rgba(255,255,255,.14)" }, g);
  const tt = text(g, x + cw / 2, 44, m.t, { size: 15, weight: 700, max: 14 });
  m.hold.forEach((hd, j) => { const [, c] = HOLD[hd], y = y0 + j * rh; s("rect", { x: x + 16, y: y + 8, width: cw - 32, height: rh - 14, rx: 12, fill: hexA(c, 0.22), stroke: c, "stroke-width": 1.5 }, g); text(g, x + cw / 2, y + rh / 2 + 6, HOLD[hd][0], { size: hd === "Y" ? 11 : 13.5, weight: 700, fill: c, max: 14 }); });
  g.addEventListener("click", () => pick(i)); cols.push(bgc);
});
LANES.forEach((l, j) => text(sv, 18, y0 + j * rh + rh / 2 + 4, l, { size: 13, weight: 500, anchor: "start", fill: "rgba(255,255,255,.8)", max: 22 }));
// "what happens over time" chart
const cx0 = 230, cy0 = 600, cwid = 740, chh = 220;
text(sv, 18, 372, "WHAT HAPPENS AS THE CODEBASE GROWS", { size: 12, weight: 700, fill: C.yellow, anchor: "start", "letter-spacing": 1.5 });
s("path", { d: `M${cx0} ${cy0 - chh} V${cy0} H${cx0 + cwid}`, fill: "none", stroke: "rgba(255,255,255,.3)" }, sv);
text(sv, cx0 + cwid, cy0 + 24, "time and size of the codebase →", { size: 12, anchor: "end", fill: "rgba(255,255,255,.55)", weight: 400 });
text(sv, cx0 - 12, cy0 - chh + 6, "working features", { size: 12, anchor: "end", fill: "rgba(255,255,255,.55)", weight: 400 });
// each mode: fast start (speed), then decay that depends on how much proof exists
const curve = (m) => { const proof = { H: 0.9, S: 0.75, Y: 1, N: 0.05 }[m.hold[3]]; let y = 0, d = ""; for (let i = 0; i <= 60; i++) { const t = i / 60, drag = (1 - proof) * t * t * 9; y += Math.max(0.02, m.speed * (1 - Math.min(0.97, drag / 2))) / 60; d += `${i ? "L" : "M"}${cx0 + t * cwid} ${cy0 - Math.min(1, y / 5.2) * chh} `; } return d; };
const lines = MODES.map((m, i) => { const p = s("path", { d: curve(m), fill: "none", stroke: "rgba(255,255,255,.22)", "stroke-width": 2 }, sv); return p; });
const tag = text(sv, 0, 0, "", { size: 13, weight: 700, anchor: "start" });
const ro = readout(side), fit = card(side, "What it is fit for"), fitB = h("div", {}, fit.body);
const lg = card(side, "Who holds it"); legend(lg.body, Object.values(HOLD).map(([l, c]) => [l, c]));
h("p", { style: "margin-top:10px", html: "The risk in vibe-coding is not that AI writes the code. It is the two red cells: <b>nobody reads it</b> and <b>nothing proves it</b>." }, lg.body);
function pick(i) {
  const m = MODES[i];
  cols.forEach((c, k) => { c.setAttribute("stroke", k === i ? C.yellow : "rgba(255,255,255,.14)"); c.setAttribute("stroke-width", k === i ? 3 : 1); c.setAttribute("fill", k === i ? "rgba(255,230,0,.07)" : "rgba(255,255,255,.03)"); });
  lines.forEach((l, k) => { l.setAttribute("stroke", k === i ? (m.id === "vibe" ? C.red : C.yellow) : "rgba(255,255,255,.22)"); l.setAttribute("stroke-width", k === i ? 4.5 : 2); });
  const end = lines[i].getPointAtLength(lines[i].getTotalLength()); tag.setAttribute("x", Math.min(end.x - 150, 820)); tag.setAttribute("y", end.y - 12); tag.textContent = m.t; tag.setAttribute("fill", m.id === "vibe" ? C.red : C.yellow);
  ro.set(`Mode ${i + 1} of 5`, m.t, `${m.d}<p style="margin-top:10px"><b>Works when:</b> ${m.works}</p><p style="margin-top:6px"><b>Breaks when:</b> ${m.breaks}</p>`);
  fitB.innerHTML = FIT.map((f, k) => `<div class="field" style="margin-bottom:8px"><div class="row"><span>${f}</span><b>${m.fit[k] > 0.75 ? "yes" : m.fit[k] > 0.3 ? "with care" : "no"}</b></div><div style="height:6px;border-radius:3px;background:rgba(255,255,255,.14)"><div style="height:6px;border-radius:3px;width:${m.fit[k] * 100}%;background:${m.fit[k] > 0.75 ? C.green : m.fit[k] > 0.3 ? C.yellow : C.red}"></div></div></div>`).join("");
}
pick(2);

</script>
</body>
</html>
