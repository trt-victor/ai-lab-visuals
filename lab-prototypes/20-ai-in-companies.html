<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EY.ai Lab prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/lab.css">
<script src="assets/lab.js"></script>
</head>
<body data-page="20-ai-in-companies">
<main class="page "><section id="stage" class="stage glass"></section><aside id="side" class="side"></aside></main>
<script>
const { C, s, h, $, clamp, lerp, ease, wait, tween, hexA, svg, arrow, text, node, edge, port, link, token, panzoom, zoomButtons, seg, slider, toggle, card, readout, kpis, legend, store, PAGES } = Lab;
const stage = $("stage"), side = $("side");
// ---- AI within companies, three leadership views: where value sits, what it takes, how you build it ----
const bar = h("div", { class: "bar" }, stage), holder = h("div", {}, stage), ro = readout(side);
const view = seg(bar, [["value", "1 · Where value sits"], ["takes", "2 · What it takes"], ["build", "3 · How you build it"]], "value", show);
const q = card(side, "Five questions for the board");
q.body.innerHTML = "<ul><li>Which three decisions or processes would matter most if they were twice as fast and provably right?</li><li>Can we show, for any AI output we rely on, why we trust it?</li><li>Who owns AI outcomes: IT, the business, or nobody?</li><li>What are we renting, and what must we own?</li><li>What happens to the people whose work changes?</li></ul>";
// ---- view 1: horizon × reach bubbles ----
const INIT = [
  ["Assistants for everyone", 0, 0, 22, "Copilots and chat for drafting, summarising, searching.", "Minutes saved per person per day. Real, diffuse, hard to see in the P&L.", "Licences, training, an acceptable-use policy."],
  ["Coding assistants", 0, 1, 20, "AI in the developer's editor and terminal.", "Faster delivery where review and testing keep up.", "Engineering discipline: tests, review, guardrails."],
  ["Meeting & document intelligence", 0, 1, 15, "Notes, actions, search across what the organisation already knows.", "Less re-work and re-asking.", "Clean permissions on your documents."],
  ["Service desk agent", 1, 2, 24, "An agent resolves routine requests end to end and escalates the rest.", "Lower cost to serve, faster resolution, measurable.", "Process redesign, systems access, human gates."],
  ["Claims / case handling", 1, 2, 28, "Agents extract, check and propose; people decide exceptions.", "Cycle time from days to hours with an audit trail.", "A governed flow: rules as checks, evidence by default."],
  ["Finance close & reconciliation", 1, 2, 22, "Matching, variance explanation, first-draft commentary.", "Days off the close; controllers focus on judgement.", "Data quality and control design."],
  ["Governed software delivery", 1, 3, 30, "Idea to production as cycles with agents and automated gates.", "Small teams operating flows instead of large teams maintaining products.", "A platform, laws, exit contracts, new roles."],
  ["AI-native product or service", 2, 3, 26, "An offering that could not exist without AI.", "New revenue, new market position.", "Proprietary data, product talent, appetite for risk."],
  ["Dynamic pricing & decisioning", 2, 2, 20, "Quant models and agents acting on live data.", "Margin and growth.", "Model risk management, real-time data."],
];
function value() {
  holder.innerHTML = ""; const sv = svg(holder, 1000, 600), HX = ["Productivity", "Process reimagination", "New business"], HY = ["Individual", "Team", "Function", "Enterprise"], x0 = 150, y0 = 60, cw = 270, ch = 122;
  HX.forEach((t, i) => { s("rect", { x: x0 + i * cw + 4, y: y0, width: cw - 8, height: ch * 4, rx: 20, fill: hexA([C.blue, C.magenta, C.yellow][i], 0.05), stroke: hexA([C.blue, C.magenta, C.yellow][i], 0.4) }, sv); text(sv, x0 + i * cw + cw / 2, 40, t, { size: 18, weight: 700, fill: [C.blue, C.magenta, C.yellow][i] }); });
  text(sv, x0 + cw * 1.5, 582, "do the same work faster  →  do the work differently  →  do different work", { size: 13, fill: "rgba(255,255,255,.6)", weight: 400 });
  HY.forEach((t, j) => { text(sv, x0 - 16, y0 + (3 - j) * ch + ch / 2 + 5, t, { size: 15, weight: 700, anchor: "end" }); if (j) s("line", { x1: x0, x2: x0 + cw * 3, y1: y0 + (4 - j) * ch, y2: y0 + (4 - j) * ch, stroke: "rgba(255,255,255,.1)" }, sv); });
  text(sv, 26, y0 + ch * 2, "HOW FAR IT REACHES →", { size: 12, weight: 700, fill: C.yellow, "letter-spacing": 2, transform: `rotate(-90 26 ${y0 + ch * 2})` });
  const used = {}; const els = INIT.map(([t, hx, hy, r, d, v, need], i) => { const key = hx + "|" + hy, n = (used[key] = (used[key] || 0) + 1), cnt = INIT.filter((q) => q[1] === hx && q[2] === hy).length, x = x0 + hx * cw + cw / 2 + (n - (cnt + 1) / 2) * 84, y = y0 + (3 - hy) * ch + ch / 2; const g = s("g", { style: "cursor:pointer" }, sv), c = s("circle", { cx: x, cy: y, r: r + 8, fill: hexA([C.blue, C.magenta, C.yellow][hx], 0.3), stroke: [C.blue, C.magenta, C.yellow][hx], "stroke-width": 2 }, g); text(g, x, y + 4, t, { size: 10.5, weight: 700, max: 13 }); g.addEventListener("click", () => pick(i)); return c; });
  const pick = (i) => { const [t, hx, hy, , d, v, need] = INIT[i]; els.forEach((e, j) => { e.setAttribute("stroke-width", j === i ? 5 : 2); e.style.filter = j === i ? "url(#glow)" : "none"; }); ro.set(`${HX[hx]} · ${HY[hy]}`, t, `${d}<p style="margin-top:8px"><b>Value:</b> ${v}</p><p style="margin-top:6px"><b>It needs:</b> ${need}</p>`); };
  pick(4);
}
// ---- view 2: the iceberg ----
const ICE = [["Use cases & models", 10, C.yellow, "What everyone sees and talks about.", "Are we choosing cases by value, or by what is easy to demo?"], ["Technology platform", 20, C.magenta, "Models, tooling, integration, environments.", "Do teams build on a shared platform, or each on their own?"], ["Data foundation", 20, C.cyan, "Access, quality, rights, lineage.", "Is the data we need usable, and are we allowed to use it?"], ["Governance & risk", 15, C.green, "Rules, controls, evidence, regulation.", "Can we prove what an AI system did and why we trusted it?"], ["People & skills", 15, C.blue, "Literacy, new roles, changed jobs.", "Who is learning to work this way, and who is being left out?"], ["Operating model", 20, C.orange, "How work, decisions and accountability flow.", "Have we redesigned the process, or bolted AI onto the old one?"]];
function takes() {
  holder.innerHTML = ""; const sv = svg(holder, 1000, 600), els = []; let y = 40;
  s("path", { d: "M0 128 Q 250 108 500 128 T 1000 128", fill: "none", stroke: C.cyan, "stroke-width": 2, "stroke-dasharray": "8 8" }, sv); text(sv, 980, 118, "what is visible", { size: 12, anchor: "end", fill: C.cyan, weight: 500 }); text(sv, 980, 148, "what makes it work", { size: 12, anchor: "end", fill: C.cyan, weight: 500 });
  ICE.forEach(([t, pct, c, d], i) => { const hh = 30 + pct * 3.1, w = 300 + i * 100, g = s("g", { style: "cursor:pointer" }, sv); const r = s("path", { d: `M${500 - w / 2 + 30} ${y} H${500 + w / 2 - 30} L${500 + w / 2 + 20} ${y + hh} H${500 - w / 2 - 20} z`, fill: hexA(c, 0.22), stroke: c, "stroke-width": 2 }, g); text(g, 500, y + hh / 2 + 2, t, { size: 18, weight: 700 }); text(g, 500, y + hh / 2 + 22, `≈ ${pct}% of the effort`, { size: 12, fill: "rgba(255,255,255,.7)", weight: 400 }); g.addEventListener("click", () => pick(i)); els.push(r); y += hh + 8; });
  const pick = (i) => { const [t, pct, c, d, qn] = ICE[i]; els.forEach((e, j) => { e.setAttribute("stroke-width", j === i ? 5 : 2); e.style.filter = j === i ? `drop-shadow(0 0 12px ${ICE[j][2]})` : "none"; }); ro.set(`About ${pct}% of the effort`, t, `${d}<p style="margin-top:8px"><b>The leadership question:</b> ${qn}</p><p style="margin-top:8px" class="hint">Percentages are illustrative. The point is the shape: most of the work is below the waterline.</p>`); };
  pick(5);
}
// ---- view 3: buy / configure / build ----
const APP = [["Buy", "AI that arrives inside the software you already license.", ["Suite copilots", "Embedded assistants", "Vendor agents"], [5, 1, 1, 2], C.blue, "Table stakes. Your competitors get the same features on the same day."], ["Configure & integrate", "General assistants and agent platforms, connected to your data and systems.", ["Assistants on your documents", "Agents on a vendor platform", "Workflow automation"], [3, 3, 3, 3], C.magenta, "Where most enterprise value is today. The integration and the data are yours; the engine is rented."], ["Build", "Your own agents, flows and platform, tailored to how you work.", ["Custom agents", "Governed delivery platform", "Fine-tuned or local models"], [1, 5, 5, 5], C.yellow, "Justified where the process is your advantage or the rules are strict. Needs engineering and an operating model."]];
function build() {
  holder.innerHTML = ""; const sv = svg(holder, 1000, 600), els = [], DIMS = ["Speed to value", "Differentiation", "Control & sovereignty", "Investment & skills"];
  APP.forEach(([t, d, ex, sc, c], i) => { const x = 30 + i * 322, g = s("g", { style: "cursor:pointer" }, sv); const r = s("rect", { x, y: 30, width: 296, height: 540, rx: 26, fill: hexA(c, 0.07), stroke: c, "stroke-width": 2 }, g); text(g, x + 148, 80, t, { size: 26, weight: 700, fill: c }); text(g, x + 148, 112, d, { size: 13, fill: "rgba(255,255,255,.75)", weight: 400, max: 34 });
    ex.forEach((e, j) => { s("rect", { x: x + 28, y: 176 + j * 46, width: 240, height: 36, rx: 18, fill: "rgba(255,255,255,.06)", stroke: "rgba(255,255,255,.2)" }, g); text(g, x + 148, 199 + j * 46, e, { size: 13, weight: 500 }); });
    DIMS.forEach((dm, j) => { const y = 350 + j * 52; text(g, x + 28, y, dm, { size: 12, anchor: "start", fill: "rgba(255,255,255,.65)", weight: 400 }); for (let q = 0; q < 5; q++) s("rect", { x: x + 28 + q * 49, y: y + 8, width: 43, height: 10, rx: 5, fill: q < sc[j] ? (j === 3 ? C.orange : c) : "rgba(255,255,255,.12)" }, g); });
    g.addEventListener("click", () => pick(i)); els.push(r); });
  const pick = (i) => { const [t, d, , , c, note] = APP[i]; els.forEach((e, j) => { e.setAttribute("stroke-width", j === i ? 5 : 2); e.style.filter = j === i ? `drop-shadow(0 0 14px ${APP[j][4]})` : "none"; }); ro.set("Building approach", t, `${d}<p style="margin-top:8px">${note}</p><p style="margin-top:8px" class="hint">Most organisations run all three at once. The decision is per use case, not per company.</p>`); };
  pick(1);
}
function show(v) { ({ value, takes, build })[v](); }
show("value");

</script>
</body>
</html>
