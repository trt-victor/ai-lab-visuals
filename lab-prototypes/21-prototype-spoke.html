<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EY.ai Lab prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/lab.css">
<script src="assets/lab.js"></script>
</head>
<body data-page="21-prototype-spoke">
<main class="page "><section id="stage" class="stage glass"></section><aside id="side" class="side"></aside></main>
<script>
const { C, s, h, $, clamp, lerp, ease, wait, tween, hexA, svg, arrow, text, node, edge, port, link, token, panzoom, zoomButtons, seg, slider, toggle, card, readout, kpis, legend, store, PAGES } = Lab;
const stage = $("stage"), side = $("side");
// ---- The AI prototype as a spoke diagram: what must be proven on each spoke at each stage, and who in EY helps ----
// EY contacts are placeholders taken from the Lab screen. Edit WHO to change them.
const WHO = { lab: "EY.ai Lab", studio: "EY Studio+", de: "EY Digital Engineering", data: "EY AI & Data", risk: "EY Risk & Assurance", cyber: "EY Cybersecurity" };
const STAGES = ["Prototype", "Pilot", "Production"];
const SP = [
  { t: "Desirability", who: "studio", q: "Does anyone want this?", lv: [3, 4, 5], need: ["Five real users try it and say what they would use it for.", "A team uses it in real work for weeks; usage is measured.", "Adoption targets, training and support are in place."] },
  { t: "Feasibility", who: "lab", q: "Does it work on our material?", lv: [4, 4, 5], need: ["It works on real examples, including the awkward ones.", "It holds up on a representative sample, with measured quality.", "Quality is monitored continuously against a golden set."] },
  { t: "Viability", who: "lab", q: "Is it worth it?", lv: [2, 4, 5], need: ["A rough value hypothesis and a cost per use.", "A measured before/after on a real process.", "A funded business case with an owner."] },
  { t: "Data", who: "data", q: "Can we use the data?", lv: [2, 4, 5], need: ["A sample we are allowed to use, with known gaps.", "Access, rights and quality confirmed for the pilot scope.", "Pipelines, lineage and retention under control."] },
  { t: "Governance", who: "risk", q: "Can we show it is under control?", lv: [1, 3, 5], need: ["Risks named; a human reviews every output.", "Rules written as checks; decisions logged; AI Act classification done.", "Evidence produced automatically; controls tested; accountable owner."] },
  { t: "Security", who: "cyber", q: "Can it be abused?", lv: [1, 3, 5], need: ["No sensitive data, no production access.", "Threat model done; permissions scoped; prompt-injection tests run.", "Hardened, monitored, red-teamed, incident process in place."] },
  { t: "Reliability", who: "de", q: "Does it keep working?", lv: [1, 3, 5], need: ["Works on the demo path; failure modes noted.", "Evaluations run on every change; fallbacks exist.", "Service levels, monitoring and drift detection in place."] },
  { t: "Maintainability", who: "de", q: "Can someone else own it?", lv: [1, 3, 5], need: ["Throwaway code is acceptable, and is labelled as such.", "Rebuilt on the standard platform, with tests and version control.", "Documented, owned, upgradable when models change."] },
];
const PORT = [["Invoice triage", [5, 5, 4, 4, 3, 3, 3, 3], C.green], ["Contract Q&A", [4, 4, 3, 2, 2, 3, 2, 2], C.yellow], ["Sales call coach", [3, 2, 2, 1, 1, 2, 1, 1], C.red], ["Policy drafting", [4, 3, 4, 3, 2, 2, 3, 2], C.cyan]];
let stg = 0, cur = 4, mode = "single";
const bar = h("div", { class: "bar" }, stage);
seg(bar, [["single", "One prototype"], ["port", "A portfolio"]], "single", (v) => { mode = v; draw(); });
const stSeg = seg(bar, STAGES.map((t, i) => [i, t]), 0, (v) => { stg = +v; draw(); });
const sv = svg(stage, 1000, 640), g = s("g", {}, sv), CX = 500, CY = 330, R = 230;
const pt = (i, v) => { const a = -Math.PI / 2 + (i / SP.length) * Math.PI * 2, r = (v / 5) * R; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; };
const def = card(side, "What is an AI prototype?");
def.body.innerHTML = "<p>The <b>smallest working thing</b> that answers <b>one question</b> with real data and real users. It is evidence for a decision, not an early version of the product.</p><p>A prototype is allowed to be weak on the right-hand spokes. A pilot is not, and production must be strong on all of them.</p>";
const ro = readout(side), whoC = card(side, "Who in EY to call");
function draw() {
  g.innerHTML = "";
  for (let r = 1; r <= 5; r++) s("polygon", { points: SP.map((_, i) => pt(i, r).join(",")).join(" "), fill: "none", stroke: "rgba(255,255,255,.12)" }, g);
  SP.forEach((S, i) => { const [x, y] = pt(i, 5), [lx, ly] = pt(i, 6.15), on = i === cur; s("line", { x1: CX, y1: CY, x2: x, y2: y, stroke: on ? C.yellow : "rgba(255,255,255,.25)", "stroke-width": on ? 3 : 1.5 }, g);
    const gg = s("g", { style: "cursor:pointer" }, g); s("rect", { x: lx - 78, y: ly - 22, width: 156, height: 44, rx: 22, fill: on ? "rgba(255,230,0,.16)" : "rgba(20,12,45,.9)", stroke: on ? C.yellow : "rgba(255,255,255,.3)", "stroke-width": on ? 2.5 : 1.5 }, gg); text(gg, lx, ly + 5, S.t, { size: 15, weight: 700 }); gg.addEventListener("click", () => { cur = i; draw(); }); });
  if (mode === "single") {
    STAGES.forEach((_, k) => { if (k > stg) return; const c = [C.magenta, C.cyan, C.green][k]; s("polygon", { points: SP.map((S, i) => pt(i, S.lv[k]).join(",")).join(" "), fill: hexA(c, k === stg ? 0.28 : 0.08), stroke: c, "stroke-width": k === stg ? 3 : 1.5, "stroke-dasharray": k === stg ? null : "5 5" }, g); });
    SP.forEach((S, i) => { const [x, y] = pt(i, S.lv[stg]); s("circle", { cx: x, cy: y, r: i === cur ? 9 : 6, fill: [C.magenta, C.cyan, C.green][stg] }, g); });
  } else {
    PORT.forEach(([n, sc, c]) => s("polygon", { points: sc.map((v, i) => pt(i, v).join(",")).join(" "), fill: hexA(c, 0.1), stroke: c, "stroke-width": 2.5 }, g));
    s("polygon", { points: SP.map((S, i) => pt(i, S.lv[1]).join(",")).join(" "), fill: "none", stroke: "#fff", "stroke-width": 2, "stroke-dasharray": "6 6" }, g);
  }
  node(g, { x: CX, y: CY, w: 150, h: 60, label: mode === "single" ? "AI prototype" : "Portfolio", sub: mode === "single" ? STAGES[stg] : "4 prototypes", color: C.yellow, size: 16 });
  stSeg.style.display = mode === "single" ? "" : "none";
  const S = SP[cur];
  if (mode === "single") ro.set(`${S.t} · at ${STAGES[stg].toLowerCase()} stage`, S.q, `<b>What must be shown:</b> ${S.need[stg]}<div class="field" style="margin-top:10px"><div class="row"><span>Evidence expected</span><b>${S.lv[stg]}/5</b></div><div style="height:6px;border-radius:3px;background:rgba(255,255,255,.14)"><div style="height:6px;border-radius:3px;width:${S.lv[stg] * 20}%;background:${C.yellow}"></div></div></div>${stg < 2 ? `<p style="margin-top:10px" class="hint">Next stage: ${S.need[stg + 1]}</p>` : ""}`);
  else { const gap = PORT.map(([n, sc, c]) => [n, sc[cur] - S.lv[1], c]); ro.set(`${S.t} · across the portfolio`, "Which prototypes are ready for a pilot?", `The dashed white line is the bar for a pilot. On <b>${S.t.toLowerCase()}</b>:<ul>${gap.map(([n, d, c]) => `<li><b style="color:${c}">${n}</b>: ${d >= 0 ? "meets the bar" : `${-d} short`}</li>`).join("")}</ul><p style="margin-top:8px">At portfolio level the question changes from “does this one work?” to “which do we fund, which do we stop, and what can they share?”</p>`); }
  whoC.body.innerHTML = `<p><b>${WHO[S.who]}</b> for ${S.t.toLowerCase()}.</p><table class="t" style="margin-top:8px">${SP.map((x, i) => `<tr style="${i === cur ? "background:rgba(255,230,0,.08)" : ""}"><td><b>${x.t}</b></td><td>${WHO[x.who]}</td></tr>`).join("")}</table><p class="hint" style="margin-top:8px">Placeholders: confirm the owning team per spoke.</p>`;
}
draw();

</script>
</body>
</html>
