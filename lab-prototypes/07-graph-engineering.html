<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EY.ai Lab prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/lab.css">
<script src="assets/lab.js"></script>
</head>
<body data-page="07-graph-engineering">
<main class="page "><section id="stage" class="stage glass"></section><aside id="side" class="side"></aside></main>
<script>
const { C, s, h, $, clamp, lerp, ease, wait, tween, hexA, svg, arrow, text, node, edge, port, link, token, panzoom, zoomButtons, seg, slider, toggle, card, readout, kpis, legend, store, PAGES } = Lab;
const stage = $("stage"), side = $("side");
// ---- Graph engineering: a small codebase as a typed graph. Compare "looks similar" search with following real links. ----
const TYPES = { req: ["Requirement", C.yellow], mod: ["Service", C.purple], fn: ["Function", C.blue], test: ["Test", C.green], data: ["Data table", C.cyan], team: ["Team", C.orange] };
const NODES = [
  ["R1", "req", "Req: premium includes regional risk"], ["R2", "req", "Req: quotes expire after 30 days"], ["R3", "req", "Req: audit every price change"],
  ["S1", "mod", "pricing-service"], ["S2", "mod", "quote-service"], ["S3", "mod", "audit-service"], ["S4", "mod", "customer-portal"],
  ["F1", "fn", "calcPremium()"], ["F2", "fn", "applyRegionFactor()"], ["F3", "fn", "createQuote()"], ["F4", "fn", "expireQuotes()"], ["F5", "fn", "logPriceChange()"], ["F6", "fn", "renderQuotePage()"], ["F7", "fn", "loadRiskTable()"],
  ["T1", "test", "test_calcPremium"], ["T2", "test", "test_expireQuotes"], ["T3", "test", "test_regionFactor"],
  ["D1", "data", "risk_factors"], ["D2", "data", "quotes"], ["D3", "data", "price_audit"], ["O1", "team", "Team Pricing"], ["O2", "team", "Team Portal"],
].map(([id, type, label]) => ({ id, type, label, x: 500 + (Math.random() - 0.5) * 500, y: 310 + (Math.random() - 0.5) * 380, vx: 0, vy: 0 }));
const EDGES = [["S1", "F1", "contains"], ["S1", "F2", "contains"], ["S1", "F7", "contains"], ["S2", "F3", "contains"], ["S2", "F4", "contains"], ["S3", "F5", "contains"], ["S4", "F6", "contains"],
  ["F3", "F1", "calls"], ["F1", "F2", "calls"], ["F2", "F7", "calls"], ["F6", "F3", "calls"], ["F1", "F5", "calls"], ["F7", "D1", "reads"], ["F3", "D2", "writes"], ["F4", "D2", "reads"], ["F5", "D3", "writes"],
  ["R1", "F2", "implemented by"], ["R2", "F4", "implemented by"], ["R3", "F5", "implemented by"], ["T1", "F1", "tests"], ["T2", "F4", "tests"], ["T3", "F2", "tests"], ["O1", "S1", "owns"], ["O1", "S3", "owns"], ["O2", "S2", "owns"], ["O2", "S4", "owns"]];
const QS = [
  { q: "What is affected if we change applyRegionFactor()?", kw: ["region", "factor"], walk: ["F2", "F1", "F3", "F6", "T3", "T1", "R1"], truth: ["F2", "F1", "F3", "F6", "T3", "T1", "R1"], how: "Follow <b>calls</b> backwards from the function to every caller, then collect the <b>tests</b> and the <b>requirement</b> attached along the way.", lesson: "Similarity finds things with “region” or “factor” in the name. It misses the three callers, which share no words with the question, and they are exactly what will break." },
  { q: "Which requirement has no test behind it?", kw: ["requirement", "req", "test"], walk: ["R1", "F2", "T3", "R2", "F4", "T2", "R3", "F5"], truth: ["R3", "F5"], how: "For each requirement follow <b>implemented by</b> to its function, then look for an incoming <b>tests</b> edge. R3 leads to logPriceChange(), which has none.", lesson: "This is a question about a <b>missing</b> link. Text search can only return things that exist, so it returns every requirement and every test and leaves the answer to you." },
  { q: "Who must sign off a change to the risk_factors table?", kw: ["risk", "factors", "table"], walk: ["D1", "F7", "S1", "O1", "F2", "F1", "F3", "S2", "O2"], truth: ["D1", "F7", "S1", "O1", "S2", "O2"], how: "From the table follow <b>reads</b> to the function, <b>contains</b> to its service and <b>owns</b> to the team. Then follow the callers: the quote service depends on it too.", lesson: "The owner is two hops away and the dependent team is five. Neither team's name appears anywhere near the words in the question." },
];
const byId = Object.fromEntries(NODES.map((n) => [n.id, n]));
const bar = h("div", { class: "bar" }, stage);
const qSel = h("select", { class: "btn", style: "max-width:100%", on: { change: () => run() } }, bar); QS.forEach((q, i) => h("option", { value: i, text: q.q }, qSel));
const mode = seg(bar, [["sim", "Search by similarity"], ["graph", "Traverse the graph"]], "sim", () => run());
const sv = svg(stage, 1000, 620), eG = s("g", {}, sv), nG = s("g", {}, sv);
const eEls = EDGES.map(([a, b, l]) => ({ a, b, l, p: s("line", { stroke: "rgba(255,255,255,.25)", "stroke-width": 1.5 }, eG), t: text(eG, 0, 0, l, { size: 9.5, fill: "rgba(255,255,255,.4)", weight: 400 }) }));
let drag = null, heat = 1;
for (const n of NODES) {
  const c = TYPES[n.type][1], g = s("g", { style: "cursor:grab" }, nG);
  n.c = s("circle", { r: n.type === "mod" || n.type === "team" ? 16 : 12, fill: hexA(c, 0.3), stroke: c, "stroke-width": 2.5 }, g);
  n.t = text(g, 0, 0, n.label, { size: 11.5, weight: 500, stroke: "#0b0718", "stroke-width": 3.5, "paint-order": "stroke" }); n.g = g;
  g.addEventListener("pointerdown", (e) => { drag = n; heat = 0.6; sv.setPointerCapture(e.pointerId); });
}
sv.addEventListener("pointermove", (e) => { if (!drag) return; const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(sv.getScreenCTM().inverse()); drag.x = p.x; drag.y = p.y; heat = Math.max(heat, 0.3); });
sv.addEventListener("pointerup", () => (drag = null));
function sim() {
  for (const a of NODES) { for (const b of NODES) { if (a === b) continue; const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 1, f = 300000 / d2; a.vx += (dx / Math.sqrt(d2)) * f * heat; a.vy += (dy / Math.sqrt(d2)) * f * heat; } a.vx += (500 - a.x) * 0.003; a.vy += (310 - a.y) * 0.006; }
  for (const [a, b] of EDGES) { const A = byId[a], B = byId[b], dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1, f = (d - 110) * 0.02 * heat; A.vx += (dx / d) * f; A.vy += (dy / d) * f; B.vx -= (dx / d) * f; B.vy -= (dy / d) * f; }
  for (const n of NODES) { if (n !== drag) { n.x = clamp(n.x + n.vx, 140, 860); n.y = clamp(n.y + n.vy, 30, 580); } n.vx *= 0.6; n.vy *= 0.6; }
  heat *= 0.992;
}
for (let i = 0; i < 500; i++) sim(); // settle the layout before the first paint
function tick() {
  if (heat > 0.01) sim();
  for (const n of NODES) { n.c.setAttribute("cx", n.x); n.c.setAttribute("cy", n.y); n.t.setAttribute("x", n.x); n.t.setAttribute("y", n.y + 28); }
  for (const e of eEls) { const A = byId[e.a], B = byId[e.b]; e.p.setAttribute("x1", A.x); e.p.setAttribute("y1", A.y); e.p.setAttribute("x2", B.x); e.p.setAttribute("y2", B.y); e.t.setAttribute("x", (A.x + B.x) / 2); e.t.setAttribute("y", (A.y + B.y) / 2 - 3); }
  requestAnimationFrame(tick);
}
tick();
const K = kpis(side, [["found", "Found"], ["missed", "Missed"], ["noise", "Noise"]]);
const ro = readout(side), lg = card(side, "Node types"); legend(lg.body, Object.values(TYPES));
h("p", { style: "margin-top:10px", html: "<b>Graph engineering</b> means building this structure on purpose: parse code and documents into typed nodes and typed links, then let the AI query the graph instead of reading text that merely sounds relevant." }, lg.body);
const words = (sx) => sx.replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase().split(/[^a-z]+/).filter(Boolean);
let runId = 0;
async function run() {
  const my = ++runId, Q = QS[+qSel.value], truth = new Set(Q.truth);
  const paint = (hit, walking) => { for (const n of NODES) { const on = hit.has(n.id), c = TYPES[n.type][1], good = truth.has(n.id); n.g.style.opacity = on ? 1 : 0.5; n.c.setAttribute("stroke", on ? (walking ? C.yellow : good ? C.green : C.red) : c); n.c.setAttribute("stroke-width", on ? 5 : 2.5); n.c.style.filter = on ? "url(#glow)" : "none"; } for (const e of eEls) { const on = hit.has(e.a) && hit.has(e.b) && mode.value === "graph"; e.p.setAttribute("stroke", on ? C.yellow : "rgba(255,255,255,.18)"); e.p.setAttribute("stroke-width", on ? 3 : 1.5); e.t.setAttribute("fill", on ? "#fff" : "rgba(255,255,255,.3)"); } };
  const score = (hit) => { const f = [...hit].filter((x) => truth.has(x)).length; K.found(`${f}/${truth.size}`, f === truth.size ? C.green : C.yellow); K.missed(truth.size - f, truth.size - f ? C.red : C.green); K.noise(hit.size - f, hit.size - f ? C.red : C.green); };
  if (mode.value === "sim") {
    const hit = new Set(NODES.filter((n) => words(n.label).some((w) => Q.kw.some((k) => w.startsWith(k) || k.startsWith(w)))).map((n) => n.id));
    paint(hit); score(hit); ro.set("Search by similarity", "Returns what sounds like the question", `${Q.lesson}<p style="margin-top:8px" class="hint">Green ring: relevant. Red ring: returned but not part of the answer.</p>`);
  } else {
    const hit = new Set(); paint(hit); ro.set("Traverse the graph", "Follows the links that actually exist", Q.how);
    for (const id of Q.walk) { if (my !== runId) return; hit.add(id); paint(hit, true); await wait(420); }
    const ans = new Set(Q.truth); paint(ans); score(ans);
  }
}
run();

</script>
</body>
</html>
